// Pure-Java item/entity model: SNBT, the friendly text format, component schema, command
// builders. Must never depend on Minecraft, so it builds and tests on a plain JDK and survives
// Minecraft updates untouched (version-specific knowledge lives in resources/stacksmith/schema).
plugins {
	id 'java-library'
}

java {
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	// 21 so the core builds on JDKs older than Minecraft's 25; the mod runs it on 25 just fine.
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

dependencies {
	testImplementation platform("org.junit:junit-bom:${rootProject.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.junit.jupiter:junit-jupiter-params'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	testLogging {
		events 'failed', 'skipped'
		exceptionFormat 'full'
	}
}
